url: https://gempp.cl/csemGT/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    pkgdown-nav-height: 70px

navbar:
  title: csemGT
  left:
    - icon: fa-home fa-lg
      aria-label: Home
      href: index.html
    - text: Reference
      href: reference/index.html
    - text: Vignettes
      menu:
        - text: Introduction to csemGT
          href: articles/intro-csem-gt.html
        - text: Worked examples
          href: articles/examples.html
    - text: News
      href: news/index.html
  right:
    - icon: fa-github fa-lg
      aria-label: GitHub
      href: https://github.com/rgempp/csemGT

reference:
  - title: Estimation
    desc: >
      Per-person conditional standard error of measurement under the
      single-facet person-by-item crossed Generalizability Theory design.
    contents:
      - csem_gt

  - title: S3 class and methods
    desc: >
      The `csem` object and the methods that operate on it.
    contents:
      - new_csem
      - is.csem
      - print.csem
      - summary.csem
      - plot.csem
      - as.data.frame.csem
      - by_score
      - coef.csem

  - title: Plot palette
    desc: >
      Colour palette shared by `plot.csem()` and available for reuse.
    contents:
      - csem_palette

  - title: Datasets
    desc: >
      Simulated illustration datasets shipped with the package.
    contents:
      - iowa_like
      - ipip_like

  - title: internal
    contents:
      - validate_csem
      - print.summary.csem
      - by_score.csem

authors:
  René Gempp:
    href: https://gempp.cl
